{% extends 'Admin/admin_home.html' %}
{% block content %}

<br>
<div class="container">
  <center><h2>Choose Shops and view their products</h2></center>

    {% for x in var %}
<div class="gallery">
    <a  href="#">
      <img src="{{x.img.url}}" alt="Cinque Terre" width="600" height="400">
    </a>
    <div class="desc">{{x.name}} , <br> {{x.phone}} , <br> {{x.email}} , <br> {{x.address}} ,</div>
    <center><a href="/admin_view_shop_product/?id={{x.id}}" class="btn btn-success">Products</a></center>
    <br>
</div>
{% endfor %}
