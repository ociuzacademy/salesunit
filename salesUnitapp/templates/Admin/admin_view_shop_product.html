{% extends 'Admin/admin_home.html' %}
{% block content %}

<br>
<div class="container">
  <center><h2>All Products</h2></center>

    {% for x in var %}
<div class="gallery">
    <a  href="#">
      <img src="{{x.img.url}}" alt="Cinque Terre" width="600" height="400">
    </a>
    <div class="desc">{{x.name}} , <br> {{x.qty}}{{x.mesure}} , <br>Rs:{{x.price}} , <br> {{x.discription}} </div>
    
    <br>
</div>
{% endfor %}
