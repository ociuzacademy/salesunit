{% extends 'User/user_home.html' %}
{% block content %}

<br>
<div class="container">
  <center><h2>Choose Shops and view their products</h2></center>

    {% for x in var %}
<div class="gallery">
    <a  href="#">
      <img src="{{x.img.url}}" alt="Cinque Terre" width="600" height="400">
    </a>
    <div class="desc">{{x.name}} , <br> {{x.phone}} , <br> {{x.email}} , <br> {{x.address}} ,</div>
    <center><a href="/user_products/?id={{x.id}}" class="btn btn-success">Products</a></center>
    <br>
</div>
{% endfor %}


</div>

<style>
    div.gallery {
      margin: 5px;
      border: 1px solid #ccc;
      float: left;
      width: 180px;
    }
    
    div.gallery:hover {
      border: 1px solid #777;
    }
    
    div.gallery img {
      width: 100%;
      height: auto;
    }
    
    div.desc {
      padding: 15px;
      text-align: center;
    }
    </style>


{% endblock %}
